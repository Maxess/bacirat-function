name: Classroom VPS Noble GA dependency compatibility
on:
  push:
    paths:
      - .github/workflows/vps-noble-compat.yml
      - scripts/test-vps-noble-compat.py
      - scripts/build-vps-offline.py
      - server/offline/ubuntu-*-packages.txt
      - server/offline/ubuntu-packages.txt
permissions:
  contents: read
jobs:
  noble-ga-resolver:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify the dated official Noble Server image is available
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ga-cloud-image.log"
          trap 'while IFS= read -r line; do echo "::error title=GA Cloud Image::$line"; done < <(tail -18 "$log")' ERR
          (
            base=https://cloud-images.ubuntu.com/releases/noble/release-20240423
            work=$(mktemp -d)
            cd "$work"
            ls -l /usr/share/keyrings/*ubuntu* || true
            apt-cache policy ubuntu-keyring ubuntu-cloudimage-keyring
            curl --disable -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 8 --max-time 25 "$base/" | grep -E 'SHA256|amd64\.(img|manifest)' | sed -E 's/<[^>]+>/ /g' | cut -c1-220
            for name in SHA256SUMS SHA256SUMS.gpg ubuntu-24.04-server-cloudimg-amd64.manifest; do
              echo "Fetching $name"
              curl --disable -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 8 --max-time 25 "$base/$name" -o "$name"
            done
            echo "::notice title=Noble GA image::$(grep -F '*ubuntu-24.04-server-cloudimg-amd64.img' SHA256SUMS)"
            while IFS= read -r line; do echo "::notice title=Noble GA manifest::$line"; done < <(
              grep -E '^(dbus|dbus-user-session|gir1.2-glib-2.0|libdbus-1-3|libglib2.0-0t64|libglib2.0-bin|libpam-systemd|libpython3.12t64|python3|systemd-resolved|ubuntu-server|vim)[[:space:]]' ubuntu-24.04-server-cloudimg-amd64.manifest
            )
            gpgv --keyring /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg SHA256SUMS.gpg SHA256SUMS
          ) 2>&1 | tee "$log"
      - name: Reproduce the old failure and solve with the complete signed cohorts
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/v1.3.0-apt-regression.tar.gz"
          log="$RUNNER_TEMP/noble-compat.log"
          curl --disable -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 --retry 2 \
            'https://github.com/Maxess/bacirat-function/releases/download/vps-offline-v1.3.0/baci-classroom-vps-offline-v1.3.0-ubuntu24.04-amd64.tar.gz' -o "$old"
          trap 'proof=$(grep -E "^QA_APT|^E:|^Remv |^W:|^RuntimeError:|^ValueError:|^The following|^  [a-zA-Z-]|^Inst (dbus|libpython3.12t64|libglib2.0-bin|gir1.2-glib|systemd)" "$log" | tail -28 | paste -sd "|"); echo "::error title=Noble GA resolver::${proof:0:3900}"' ERR
          python3 -u scripts/test-vps-noble-compat.py "$old" 2>&1 | tee "$log"
          grep '^QA_APT ' "$log" | while IFS= read -r line; do echo "::notice title=Noble GA resolver::$line"; done
