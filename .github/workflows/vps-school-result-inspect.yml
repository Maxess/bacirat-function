name: Inspect saved nine-class QA counters
on:
  push:
    paths: ['.github/workflows/vps-school-result-inspect.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Inspect only the disposable first capacity rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for row in '140820617061 3 low' '140820616846 9 low' '140820616978 9 medium'; do
            read -r job cap quality <<< "$row"
            if gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/cap.log" 2> "$RUNNER_TEMP/log.err"; then
              for term in 'failed at line' 'QA school:' 'postprocess:' 'recorder: archive stopped' 'QA_SCHOOL_RECEIPTS' 'QA_SCHOOL_CLOSE' 'ValueError:' 'QA SCHOOLDATA'; do
                evidence=$(grep -F "$term" "$RUNNER_TEMP/cap.log" | tail -6 | sed -E 's#(https?://[^[:space:]?]+)\?[^[:space:]\"]+#\1?[redacted]#g' | cut -c1-420 | paste -sd '|') || true
                if [[ -n "$evidence" ]]; then echo "::notice title=QA $cap $quality::$evidence"; fi
              done
              grep -Eo '\{"QA-C01":\{[^\r]+$' "$RUNNER_TEMP/cap.log" | tail -1 | cut -c1-2800 | while IFS= read -r line; do echo "::notice title=Status $cap $quality::$line"; done || true
            else
              echo "::notice title=QA $cap $quality::No stored job log"
            fi
          done
          d="$RUNNER_TEMP/results"
          mkdir "$d"
          gh run download 46093842545 --pattern 'capacity-*' --dir "$d"
          python3 - "$d" <<'PY'
          from pathlib import Path
          import sys, json, runpy
          metric = runpy.run_path('tests/fixtures/vps-school-results.py')['metric']
          for file in Path(sys.argv[1]).glob('*/counters.jsonl'):
              samples = [json.loads(row) for row in file.read_text().splitlines()]
              for phase in ('live','render'):
                  data = [row for row in samples if row['phase'] == phase]
                  if len(data) < 3: continue
                  m = metric(data)
                  print('::notice title=Saved VM counters::' + json.dumps(dict(case=file.parent.name, phase=phase, **m),separators=(',',':')))
          PY
