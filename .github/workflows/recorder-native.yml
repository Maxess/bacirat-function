name: Recorder native receiver
on:
  push:
    paths:
      - .github/workflows/recorder-native.yml
      - scripts/build-recorder-native.py
      - server/recorder/native/**
permissions:
  contents: read
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.2'
          cache: false
      - run: python3 scripts/build-recorder-native.py "$RUNNER_TEMP/baci-native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baci-native-linux-amd64
          path: ${{ runner.temp }}/baci-native/
          if-no-files-found: error
          retention-days: 14
