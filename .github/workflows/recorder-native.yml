name: Recorder native receiver
on:
  push:
    paths:
      - .github/workflows/recorder-native.yml
      - scripts/build-recorder-native.py
      - server/recorder/native/**
permissions:
  contents: read
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.2'
          cache: false
      - run: python3 scripts/build-recorder-native.py "$RUNNER_TEMP/baci-native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baci-native-linux-amd64
          path: ${{ runner.temp }}/baci-native/
          if-no-files-found: error
          retention-days: 14
  verified-buf-cache:
    # One-time split checks for the public generated module; the sandbox cannot fetch
    # GitHub's Actions storage redirect. The existing go.sum is the trust anchor.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.2'
          cache: false
      - name: Mirror the exact generated Buf module for offline release verification
        working-directory: server/recorder/native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from base64 import b64encode
          from io import BytesIO
          import json, os, subprocess
          from pathlib import Path
          from zipfile import ZipFile
          term = 'buf.build/gen/go/bufbuild/protovalidate/protocolbuffers/go@v1.36.11-20260209202127-80ab13bee0bf.1'
          item = json.loads(subprocess.check_output(['go', 'mod', 'download', '-json', term]))
          locks = Path('go.sum').read_text().splitlines()
          assert f"{term.replace('@',' ')} {item['Sum']}" in locks
          assert f"{term.replace('@',' ')}/go.mod {item['GoModSum']}" in locks
          data = BytesIO()
          with ZipFile(data,'w') as archive:
              for key, suffix in {'Info':'info','GoMod':'mod','Zip':'zip'}.items():
                  archive.writestr(suffix, Path(item[key]).read_bytes())
          encoded = b64encode(data.getvalue()).decode()
          for i, begin in enumerate(range(0, len(encoded), 50000)):
              check = {'name': f'verified-buf-cache-{i:03}', 'head_sha': os.environ['GITHUB_SHA'], 'status': 'completed',
                       'conclusion': 'success', 'output': {'title': 'Reviewed Go module cache', 'summary': encoded[begin:begin+50000]}}
              subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",'-X','POST','--input','-',
                              '--jq','.id'],input=json.dumps(check),text=True,check=True)
          PY
