name: Offline classroom VPS
on:
  push:
    paths:
      - .github/workflows/vps-offline.yml
      - server/offline/**
      - scripts/build-vps-offline.py
      - scripts/test-vps-offline-vm.sh
permissions:
  contents: read
jobs:
  verify-upstream-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check the exact Playwright browser and Ubuntu VM inputs
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fSsL --retry 3 -o headless.zip https://storage.googleapis.com/chrome-for-testing-public/148.0.7778.96/linux64/chrome-headless-shell-linux64.zip
          echo "::notice title=Browser SHA-256::$(sha256sum headless.zip)"
          unzip -p headless.zip '*/LICENSE.headless_shell' > license.txt
          test -s license.txt
          echo "::notice title=Browser license::$(head -n 1 license.txt)"
          test -z "$(unzip -Z1 headless.zip | grep -i widevine || true)"
          image=$(curl -fSsL --retry 3 https://cloud-images.ubuntu.com/minimal/releases/noble/release/SHA256SUMS | grep 'minimal-cloudimg-amd64.img$')
          echo "::notice title=Ubuntu image::$image"
          if test -c /dev/kvm; then echo '::notice title=KVM::available'; fi
          df -h "$RUNNER_TEMP"
