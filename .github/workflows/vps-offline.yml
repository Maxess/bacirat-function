name: Classroom VPS installer
on:
  push:
    paths:
      - .github/workflows/vps-offline.yml
      - server/offline/**
      - server/install.py
      - server/admission.py
      - scripts/build-vps-offline.py
      - scripts/test-vps-noble-compat.py
      - scripts/test-vps-offline-vm.sh
      - scripts/vps-recording-rehearsal.sh
      - tests/fixtures/vps-record-*
      - tests/fixtures/vps-class-load.go
      - scripts/build-managed-school.py
      - plugin-manager/plugins/school-plugins.php
      - tests/*vps*offline*
      - tests/fixtures/vps-offline-peer.py
      - tests/fixtures/vps-acme-gateway.py
      - tests/fixtures/vps-live-media.go
      - server/recorder/native/go.mod
      - server/recorder/native/go.sum
      - tests/plugin-manager.php
      - artifacts/*pairing*.zip
permissions:
  contents: read
jobs:
  ubuntu-noble-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Prepare the CI/VM harness (not part of VPS installation)
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ci-prereqs.log"
          trap 'while IFS= read -r line; do echo "::error title=CI prerequisites::$line"; done < <(tail -15 "$log")' ERR
          cat > "$RUNNER_TEMP/ci.sources" <<'APT'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT
          apt=(sudo apt-get -o "Dir::Etc::sourcelist=$RUNNER_TEMP/ci.sources" -o Dir::Etc::sourceparts=-
               -o Acquire::Retries=2 -o Acquire::https::Timeout=20 -o Acquire::http::Timeout=20)
          (
            timeout 180 "${apt[@]}" -q -o APT::Update::Error-Mode=any update
            timeout 240 "${apt[@]}" install -qy --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ffmpeg php8.3-cli php8.3-sqlite3 php8.3-zip php8.3-curl
          ) 2>&1 | tee "$log"
          if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Test the site pairing and unchanged school logic
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/site-tests.log"
          trap 'while IFS= read -r line; do echo "::error title=Site test::$line"; done < <(tail -14 "$log")' ERR
          (
            php8.3 -l plugin-manager/plugins/school-plugins.php
            php8.3 tests/plugin-manager.php
            php8.3 tests/classroom-lessons.php
            php8.3 tests/classroom-recording.php
            python3 -m unittest discover -s tests -p 'test*.py'
            python3 scripts/build-managed-school.py --pairing-manager --output-dir "$RUNNER_TEMP/site"
            cmp "$RUNNER_TEMP/site/baci-classroom-site-pairing-v0.1.31.zip" artifacts/baci-classroom-site-pairing-v0.1.31.zip
            cmp "$RUNNER_TEMP/site/baci-plugin-manager-update-v0.1.31.zip" artifacts/baci-plugin-manager-update-v0.1.31.zip
          ) 2>&1 | tee "$log"
      - name: Build offline installer and matching Ubuntu source archives
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/vps-build.log"
          trap 'while IFS= read -r line; do echo "::error title=Bundle build::$line"; done < <(tail -20 "$log")' ERR
          python3 -u scripts/build-vps-offline.py "$RUNNER_TEMP/vps-release" 2>&1 | tee "$log"
          grep -E '^Ubuntu dependency inventory:|^[0-9a-f]{64}  ' "$log" | while IFS= read -r line; do echo "::notice title=Bundle manifest::$line"; done
      - name: Verify the archive keeps the older Noble Server base intact
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/v1.3.0-apt-regression.tar.gz"
          log="$RUNNER_TEMP/vps-noble-compat.log"
          curl --disable -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 --retry 2 \
            'https://github.com/Maxess/bacirat-function/releases/download/vps-offline-v1.3.0/baci-classroom-vps-offline-v1.3.0-ubuntu24.04-amd64.tar.gz' -o "$old"
          trap 'while IFS= read -r line; do echo "::error title=Noble GA APT compatibility::$line"; done < <(tail -20 "$log")' ERR
          python3 -u scripts/test-vps-noble-compat.py "$old" --candidate "$RUNNER_TEMP"/vps-release/*amd64.tar.gz 2>&1 | tee "$log"
          grep '^QA_APT ' "$log" | while IFS= read -r line; do echo "::notice title=Packaged Noble GA compatibility::$line"; done
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.2'
          cache: false
      - name: Build the two-peer WebRTC fixture on the runner (not the VPS)
        working-directory: server/recorder/native
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          go build -mod=readonly -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/vps-live-media" "$GITHUB_WORKSPACE/tests/fixtures/vps-live-media.go"
      - name: Build the off-guest teacher and pupil clients
        working-directory: server/recorder/native
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/class-load" "$GITHUB_WORKSPACE/tests/fixtures/vps-class-load.go"
          php8.3 -l "$GITHUB_WORKSPACE/tests/fixtures/vps-record-school.php"
      - name: Verify actual offline compact install and recording on Noble GA Server
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/vps-ga-recording.log"
          trap 'proof=$(grep -E "^QA_|^VM |^Baci VPS:|^gpgv:|^E:|^curl:|[Ee]rror:|^oom_kill" "$log" | tail -24 | paste -sd "|"); echo "::error title=GA Server recording::${proof:0:3900}"' ERR
          BACI_QA_BASELINE=noble-ga-server bash scripts/test-vps-offline-vm.sh "$RUNNER_TEMP"/vps-release/*amd64.tar.gz \
            files 1024 '' compact "$RUNNER_TEMP/class-load" '' 0 2>&1 | tee "$log"
          grep -Fq 'QA_APT Real GA preflight passed without modifying dpkg state.' "$log"
          grep -Fq 'QA_APT GA install preserved all ' "$log"
          grep -Fq 'QA_RECORD received and decoded an approved MP4;' "$log"
          grep -Fq 'QA_RECORD approved MP4 after the one-minute delay:' "$log"
          grep -Fq 'VM passed: 1024 MiB profile=compact tls=files' "$log"
          proof=$(grep -E '^QA_APT |^QA_RECORD |^VM baseline|^VM memory|^VM passed|^No VM Internet' "$log" | paste -sd '|')
          echo "::notice title=Packaged GA Server recording::${proof:0:4100}"
      - name: Verify 512 MiB live and full installs, both TLS modes and WebRTC
        run: |
          set -euo pipefail
          for ram in 512 4096; do
            for mode in files auto; do
              log="$RUNNER_TEMP/vps-rehearsal-$ram-$mode.log"
              trap 'while IFS= read -r line; do echo "::error title=VPS $ram $mode rehearsal::$line"; done < <(grep -E "^VM guest failure|^VM memory|^MemAvailable|^oom_kill|Out of memory|^Test CA|^Baci VPS:|^Traceback|^.*Error:|start request repeated|Failed to |\"error\":|^VM rehearsal|^VM WebRTC" "$log" | tail -14)' ERR
              bash scripts/test-vps-offline-vm.sh "$RUNNER_TEMP"/vps-release/*amd64.tar.gz "$mode" "$ram" "$RUNNER_TEMP/vps-live-media" 2>&1 | tee "$log"
              grep -Fq 'Two live WebRTC peers exchanged bidirectional Opus and teacher VP8' "$log"
              proof=$(grep -E '^VM passed:|^VM full test:|^VM memory|^VM before reboot|^No VM Internet|^Real ACME|^Two live WebRTC' "$log" | paste -sd ' ')
              echo "::notice title=Isolated VPS $ram $mode test::$proof"
            done
          done
      - name: Verify packaged compact recording and safe add-on
        run: |
          set -euo pipefail
          [[ -r /dev/kvm && -w /dev/kvm ]]
          candidates=( "$RUNNER_TEMP"/vps-release/*amd64.tar.gz )
          test "${#candidates[@]}" = 1
          candidate=${candidates[0]}
          sha256sum "$candidate"
          baseline="$RUNNER_TEMP/live-baseline-1.2.0.tar.gz"
          curl --disable -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 --retry 3 \
            'https://github.com/Maxess/bacirat-function/releases/download/vps-offline-v1.2.0/baci-classroom-vps-offline-v1.2.0-ubuntu24.04-amd64.tar.gz' -o "$baseline"
          printf '%s  %s\n' 9a79d791d38e2277b5fb29f9d05ae223338bb4c25ae30ab83ffb7c9d148c1cb4 "$baseline" | sha256sum -c --strict
          rehearsal() {
            local label=$1 tls=$2 ram=$3 scenario=$4 client=$5 swap=$6 log
            log="$RUNNER_TEMP/verified-$label.log"
            local rc=0
            bash scripts/test-vps-offline-vm.sh "$candidate" "$tls" "$ram" '' "$scenario" "$client" "$baseline" "$swap" 2>&1 | tee "$log" || rc=$?
            if (( rc != 0 )); then
              proof=$(grep -E '^QA_|^VM guest failure|^VM rehearsal|^Baci VPS:|^oom_kill|^recorder:|^postprocess:|[Ee]rror:' "$log" | tail -25 | paste -sd '|')
              echo "::error title=Packaged $label::${proof:0:4000}"
              return "$rc"
            fi
            grep -Fq "VM passed: $ram MiB profile=compact tls=$tls" "$log"
            if [[ -n "$client" ]]; then
              grep -Fq 'QA_RECORD received and decoded an approved MP4;' "$log"
              grep -Fq 'QA_RECORD approved MP4 after the one-minute delay:' "$log"
              if [[ "$scenario" == compact ]]; then
                grep -Fq 'QA_RECORD refuse: no film/upload;' "$log"
                grep -Fq 'QA_RECORD revoke: no film/upload;' "$log"
              else
                grep -Fq 'QA_ADDON rollback after a late school refusal' "$log"
                grep -Fq 'QA_ADDON enabled real Recorder on the unchanged v1.2.0 live install' "$log"
              fi
            fi
            proof=$(grep -E '^QA_|^VM memory|^VM passed|^Real ACME' "$log" | paste -sd '|')
            echo "::notice title=Packaged $label::${proof:0:4100}"
          }
          rehearsal single-vps files 512 compact "$RUNNER_TEMP/class-load" 512
          rehearsal compact-auto auto 512 compact '' 512
          rehearsal live-add-on files 1024 upgrade "$RUNNER_TEMP/class-load" 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classroom-vps-offline-verified
          path: ${{ runner.temp }}/vps-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
