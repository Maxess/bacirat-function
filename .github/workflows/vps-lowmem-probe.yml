name: Low-memory renderer diagnosis (isolated QA)
on:
  push:
    paths: [.github/workflows/vps-lowmem-probe.yml, scripts/diagnose-vps-lowmem.py]
permissions:
  contents: read
jobs:
  sandboxed-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [modern, swap]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Prepare a disposable Ubuntu VM and the pinned baseline release
        run: |
          set -euo pipefail
          sudo apt-get -q update
          sudo apt-get -qy install --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
          w="$RUNNER_TEMP/lowmem-qa"
          mkdir "$w"
          curl --disable -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 \
            'https://github.com/Maxess/bacirat-function/releases/download/vps-offline-v1.2.0/baci-classroom-vps-offline-v1.2.0-ubuntu24.04-amd64.tar.gz' -o "$w/original.tar.gz"
          printf '%s  %s\n' 9a79d791d38e2277b5fb29f9d05ae223338bb4c25ae30ab83ffb7c9d148c1cb4 "$w/original.tar.gz" | sha256sum -c --strict
          tar -xzf "$w/original.tar.gz" -C "$w"
      - name: Diagnose the baseline Chromium process inside the 512 MiB guest
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/lowmem-qa"
          export BUNDLE="$w/baci-classroom-vps-offline"
          if [[ '${{ matrix.variant }}' == modern ]]; then
            wheel=playwright-1.65.2-py3-none-manylinux1_x86_64.whl
            curl --disable -fsSL --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 \
              'https://files.pythonhosted.org/packages/de/c3/2fc4b7da0496401ecf35c3fba50235e7f2cdbe141b42be83eb2d93f08fc5/playwright-1.65.2-py3-none-manylinux1_x86_64.whl' -o "$BUNDLE/wheels/$wheel"
            printf '%s  %s\n' 58932d35f56767ab7ebcdd3d4a733bfb3e62a1a5bc43c08e28b9fa9b3e61cf33 "$BUNDLE/wheels/$wheel" | sha256sum -c --strict
            curl --disable -fsSL --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 \
              'https://storage.googleapis.com/chrome-for-testing-public/159.0.8154.6/linux64/chrome-headless-shell-linux64.zip' -o "$BUNDLE/payload/chrome-headless-shell-linux64.zip"
            echo "::notice title=Chromium 159 QA download::$(sha256sum "$BUNDLE/payload/chrome-headless-shell-linux64.zip" | cut -d' ' -f1)"
          fi
          QA_MODE='${{ matrix.variant }}' python3 scripts/diagnose-vps-lowmem.py "$BUNDLE"
          (
            cd "$BUNDLE"
            find . -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar -C "$w" -cf - baci-classroom-vps-offline | gzip -n -1 > "$w/diagnosis-only.tar.gz"
          set +e
          bash scripts/.vps-lowmem-probe-ci.sh "$w/diagnosis-only.tar.gz" files 512 2>&1 | tee "$w/result.log"
          rc=${PIPESTATUS[0]}
          set -e
          proof=$(grep -E '^QA_BROWSER|^QA_PHASE|^QA_VM|^QA_MEMORY|^QA_DIAG|^QA_TRACE|^VM memory|^oom_kill|^VM guest failure|^VM passed' "$w/result.log" | tail -16 | paste -sd '|')
          echo "::notice title=512 MiB ${{ matrix.variant }} probe::${proof:0:3900}"
          exit "$rc"
