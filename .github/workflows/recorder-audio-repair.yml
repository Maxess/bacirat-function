name: Recorder audio r2 on the released VPS
on:
  push:
    paths:
      - .github/workflows/recorder-audio-repair.yml
      - artifacts/baci-recorder-audio-repair-v0.4.23-r2.py
      - scripts/build-managed-school.py
      - scripts/test-vps-offline-vm.sh
      - scripts/vps-audio-repair-rehearsal.sh
      - scripts/vps-recording-rehearsal.sh
      - server/recorder/repair-audio-v0.4.23-r2.py
      - server/recorder/replay.js
      - tests/test_recorder_audio_repair.py
      - tests/test_renderer_encoder.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-on-vps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: compact
            scenario: compact
            ram: 512
            swap: 512
          - profile: full
            scenario: default
            ram: 4096
            swap: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Prepare disposable Ubuntu VM dependencies
        run: |
          set -euo pipefail
          sudo apt-get -q update
          sudo apt-get -qy install --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod a+rw /dev/kvm
      - name: Test byte reproducibility, refusal and rollback
        run: PYTHONPATH=tests python3 -m unittest -v test_recorder_audio_repair
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: matrix.profile == 'compact'
        with:
          go-version: '1.26.2'
          cache-dependency-path: server/recorder/native/go.sum
      - name: Test speech continuity in Chromium and build off-guest media clients
        if: matrix.profile == 'compact'
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          sudo apt-get -qy install --no-install-recommends ffmpeg python3-venv php8.3-cli php8.3-sqlite3 php8.3-curl
          /usr/bin/python3 -m venv "$RUNNER_TEMP/audio-python"
          "$RUNNER_TEMP/audio-python/bin/pip" install --require-hashes -r server/offline/requirements.lock
          export MPM_TEST_CHROMIUM=$(command -v google-chrome) PYTHONPATH=tests
          "$RUNNER_TEMP/audio-python/bin/python" -m unittest -v test_renderer_encoder
          (cd server/recorder/native; go build -mod=readonly -trimpath -o "$RUNNER_TEMP/class-load" "$GITHUB_WORKSPACE/tests/fixtures/vps-class-load.go")
      - name: Apply and roll back on the exact published 1.3.2 install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=baci-classroom-vps-offline-v1.3.2-ubuntu24.04-amd64.tar.gz
          gh release download vps-offline-v1.3.2 --pattern "$archive" -D "$RUNNER_TEMP/baci-audio-vps"
          bundle="$RUNNER_TEMP/baci-audio-vps/$archive"
          printf '%s  %s\n' 81f47e03f417489a906fcea6ab8aa79239edcb933612fbe050fd101bf1a40e37 "$bundle" | sha256sum --strict -c
          client=
          if [[ '${{ matrix.profile }}' == compact ]]; then client="$RUNNER_TEMP/class-load"; fi
          log="$RUNNER_TEMP/audio-vps.log"
          trap 'proof=$(grep -E "^QA_|^Baci |^VM |Audio repair refused|[Ee]rror:|Failed to|^oom_kill" "$log" | tail -25 | paste -sd "|"); echo "::error title=Audio r2 VM::$proof"' ERR
          BACI_QA_AUDIO_REPAIR=1 bash scripts/test-vps-offline-vm.sh "$bundle" files '${{ matrix.ram }}' '' '${{ matrix.scenario }}' "$client" '' '${{ matrix.swap }}' 2>&1 | tee "$log"
          grep -Fq 'QA_AUDIO repair and rollback verified' "$log"
          if [[ -n "$client" ]]; then
            grep -Fq 'QA_AUDIO active recording refused the update' "$log"
            grep -Fq 'QA_AUDIO approved film with r2 passed' "$log"
          fi
          grep -E '^QA_AUDIO|^VM passed' "$log" | while IFS= read -r line; do echo "::notice title=Audio r2 VM::$line"; done
