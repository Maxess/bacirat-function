name: Classroom VPS direct GitHub install
on:
  workflow_call:
    inputs:
      expect_public:
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/vps-from-github.yml
      - install-vps.sh
      - tests/test_vps_github_install.py
      - docs/vps-offline-release.json
permissions:
  contents: read
jobs:
  ubuntu-github-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Test download integrity and argument and failure propagation
        run: |
          bash -n install-vps.sh
          python3 -m unittest discover -s tests -p test_vps_github_install.py
      - name: Check whether this exact archive has been published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_PUBLIC: ${{ inputs.expect_public || false }}
        run: |
          set -euo pipefail
          v=$(jq -r .version docs/vps-offline-release.json)
          name="baci-classroom-vps-offline-v$v-ubuntu24.04-amd64.tar.gz"
          digest="sha256:$(jq -r .installer_sha256 docs/vps-offline-release.json)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"vps-offline-v$v\" and .draft == false) | .id")
          if [[ -n "$id" ]]; then
            [[ "$id" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
              | jq -e --arg name "$name" --arg digest "$digest" 'any(.[]; .name == $name and .digest == $digest)'
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo 'ready=yes' >> "$GITHUB_OUTPUT"
          elif [[ "$EXPECT_PUBLIC" == true ]]; then
            echo '::error title=Direct GitHub install::Expected the matching release to be public.'
            exit 1
          else
            echo 'Public archive not available yet; the isolated offline launcher check runs separately.'
          fi
      - name: Fetch the public release launcher and archive, and run preflight
        if: steps.release.outputs.ready == 'yes'
        env:
          VPS_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/baci-github-preflight.XXXXXXXX")
          log="$work/preflight.log"
          trust="/usr/local/share/ca-certificates/$(basename "$work").crt"
          cleanup() {
            if [[ -f "$trust" ]]; then
              sudo rm -f -- "$trust"
              sudo update-ca-certificates >/dev/null
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          trap 'echo "::error title=GitHub install preflight::Failed on line $LINENO: $BASH_COMMAND"; if [[ -s "$log" ]]; then while IFS= read -r line; do echo "::error title=Installer output::$line"; done < <(tail -10 "$log"); fi' ERR
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 12 --max-time 30 \
            "https://github.com/Maxess/bacirat-function/releases/download/vps-offline-v$VPS_VERSION/install-vps.sh" \
            --output "$work/install-vps.sh"
          cmp install-vps.sh "$work/install-vps.sh"
          cd "$work"
          # Throwaway certificate on a reserved hostname; no real trust or ACME changes.
          openssl req -x509 -newkey rsa:2048 -nodes -days 3 -subj '/CN=Baci GitHub QA root only' \
            -keyout ca.key -out ca.crt >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes -subj '/CN=media.example.test' \
            -keyout privkey.pem -out leaf.csr >/dev/null 2>&1
          printf 'subjectAltName=DNS:media.example.test\nextendedKeyUsage=serverAuth\n' > leaf.ext
          openssl x509 -req -days 2 -in leaf.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -extfile leaf.ext -out fullchain.pem >/dev/null 2>&1
          chmod 600 privkey.pem
          sudo install -m 0644 ca.crt "$trust"
          sudo update-ca-certificates >/dev/null
          # The hosted runner makes /opt writable for its tool cache. Present a stock
          # root-owned /opt in a private test mount namespace, without relaxing any installer checks.
          sudo install -d -m 0755 "$work/stock-opt"
          sha256sum /var/lib/dpkg/status > dpkg.before
          sudo unshare --mount --propagation private /bin/bash -c '
            set -eu
            mount --bind "$1/stock-opt" /opt
            exec runuser -u "$2" -- /usr/bin/env TMPDIR="$1" /bin/bash ./install-vps.sh "${@:3}"
          ' _ "$work" "$(id -un)" --check \
            --site https://school.example.test/campus --media media.example.test --ipv4 192.0.0.9 2>&1 | tee "$log"
          grep -Fq "archive_sha256=ok version=$VPS_VERSION" "$log"
          if [[ "$VPS_VERSION" != 1.3.0 ]]; then
            grep -Fq 'apt_plan=ok (read-only; no packages were changed)' "$log"
          fi
          sha256sum --strict --check dpkg.before
          # The hosted runner has ample RAM. Automatic selection must retain
          # recording and use the verified certificate pair in this directory.
          grep -Fq 'preflight=ok tls=files profile=full' "$log"
          test -z "$(find "$work" -maxdepth 1 -name 'baci-vps-github.*' -print -quit)"
          test -z "$(find "$work/stock-opt" -mindepth 1 -print -quit)"
          for path in /etc/school-classroom /usr/local/sbin/baci-vps /run/baci-vps-install.lock "$HOME/Baci-VPS-pairing.json"; do
            test ! -e "$path"
          done
          echo '::notice title=Direct GitHub install::The pinned public archive downloaded, matched the reviewed SHA-256 and passed the real full-recording installer preflight without installing or generating pairing credentials.'
