name: Nine classroom VPS capacity probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vps-school-capacity.yml
      - scripts/vps-school-rehearsal.sh
      - tests/fixtures/vps-school-*
permissions:
  contents: read
jobs:
  nine-bells:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - recordings: 0
            quality: low
          - recordings: 3
            quality: low
          - recordings: 9
            quality: low
          - recordings: 9
            quality: medium
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.2'
          cache-dependency-path: server/recorder/native/go.sum
      - name: Build and prepare off-guest WebRTC and school fixtures
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/prepare.log"
          trap 'proof=$(tail -15 "$log" | paste -sd "|"); echo "::error title=Capacity probe preparation::${proof:0:3100}"' ERR
          exec 3>&1
          {
            sudo apt-get -q -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
            sudo apt-get -qy -o Acquire::Retries=3 install --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ffmpeg php8.3-cli php8.3-sqlite3 php8.3-curl
            sudo chmod a+rw /dev/kvm
            gofmt -w tests/fixtures/vps-school-load.go
            (cd server/recorder/native && go build -mod=readonly -trimpath -o "$RUNNER_TEMP/school-load" "$GITHUB_WORKSPACE/tests/fixtures/vps-school-load.go")
            php -l tests/fixtures/vps-school-record.php
          } > "$log" 2>&1
          tail -10 "$log" >&3
      - name: Download and verify the exact public VPS 1.3.3 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=baci-classroom-vps-offline-v1.3.3-ubuntu24.04-amd64.tar.gz
          sha=33f90e0fa350078bdfaa487adda3ba66f0182eb272f0f15e1b67a927ad3fe176
          gh release download vps-offline-v1.3.3 --repo Maxess/bacirat-function --pattern "$name" --dir "$RUNNER_TEMP"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/$name" | sha256sum --strict -c
          echo "BACI_ARCHIVE=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
      - name: Sample 189 real WebRTC peers in nine rooms and decode all approved films
        env:
          BACI_QA_SCHOOL_CAPTURES: ${{ matrix.recordings }}
          BACI_QA_SCHOOL_QUALITY: ${{ matrix.quality }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qa-school-results"
          mkdir "$out"
          export BACI_QA_SCHOOL_RESULTS="$out"
          log="$RUNNER_TEMP/qa-school.log"
          trap 'proof=$(grep -E "^QA_SCHOOL_(STAGE|CLOSE|RECEIPTS|ACTIVE)|[Ee]rror:|refused|AssertionError|^VM guest failure|QA school:" "$log" | tail -16 | paste -sd "|"); echo "::error title=Nine-class rehearsal::${proof:0:3800}"' ERR
          bash scripts/test-vps-offline-vm.sh "$BACI_ARCHIVE" files 4096 '' default "$RUNNER_TEMP/school-load" 2>&1 | tee "$log"
          test -s "$out/measurement.json"
          grep -E '^QA_SCHOOL_(CI|JOIN|SOURCES|LIMIT|ACTIVE|BOARD|RECEIPTS|METRICS|OFFER|FILMS|RESULT|PASS|VARIANT)\b' "$log" | while IFS= read -r line; do
            echo "::notice title=Nine-class capacity::$line"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: capacity-${{ matrix.quality }}-${{ matrix.recordings }}-recordings
          path: ${{ runner.temp }}/qa-school-results
          if-no-files-found: ignore
          retention-days: 14
