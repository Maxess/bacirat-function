[Unit]
Wants=school-classroom-postprocess.service
After=school-classroom-postprocess.service

[Service]
ExecStart=
ExecStart=/opt/school-classroom-recorder/venv/bin/python -Esu /opt/school-classroom-recorder/releases/0.4.23/recording.py %t/school-classroom-recorder-credential/config.json --native-receiver /opt/school-classroom-recorder/releases/0.4.23/baci-native-receiver --postprocess-socket /run/school-classroom-postprocess/render.sock
# Keep capture below the default (100) weight of a stock SFU without changing its configuration.
CPUWeight=50
IOWeight=50
MemoryHigh=384M
MemoryMax=768M
TasksMax=128
LimitCORE=0
