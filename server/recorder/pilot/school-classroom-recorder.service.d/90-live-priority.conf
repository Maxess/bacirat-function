[Unit]
Wants=school-classroom-postprocess.service

[Service]
ExecStart=
ExecStart=/opt/school-classroom-recorder/venv/bin/python -Esu /opt/school-classroom-recorder/recording.py ${CREDENTIALS_DIRECTORY}/config.json --native-receiver /opt/school-classroom-recorder/baci-native-receiver --postprocess-socket /run/school-classroom-postprocess/render.sock
CPUWeight=250
IOWeight=250
MemoryHigh=384M
MemoryMax=768M
TasksMax=128
LimitCORE=0
