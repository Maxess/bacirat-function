  # maximum file size in MB . Default 50MB
  max_size: 20
  # maximum file size in MB for office upload. Default 5MB
  max_size_office_file: 5
  # maximum file size in MB for whiteboard upload. Default 10MB
  max_size_pwa_file: 10

recorder:
