# office online ------------------------------------------------------------------------------
office_enable: false
only_office_enable: false
office_url: 
only_office_url: 


# db ------------------------------------------------------------------------------------------
# database driver - sqlite3 | mysql | postgres | sqlserver
driver_name: sqlite3
# connection_string - for sqlite3 enter name of db file
# mysql connectionString format  "user:password@tcp(ip:port)/dbname"
# mysql connectionString sample  "root:pass@tcp(127.0.0.1:3306)/testdb"
# sqlserver connectionString sample  "sqlserver://sa:passA1!@DESKTOP-TN3URK2?database=p1"
# postgres connectionString sample  "host=localhost user=postgres password=pass dbname=db3 port=5433 sslmode=disable TimeZone=Asia/Shanghai"

connection_string: "./test.db"
#connection_string: "root:pppp@tcp(127.0.0.1:3306)/p11?charset=utf8mb4&parseTime=True&loc=Local"
#connection_string: "sqlserver://sa:passA1!@DESKTOP-TN3URK2?database=p3"
#connection_string: "host=localhost user=postgres password=pass dbname=db6 port=5433 sslmode=disable TimeZone=Asia/Shanghai"
# db end ----------------------------------------------------------------------------------------

sfu_server:
  internal: true
  url: ''  
  run: auto # auto | manual
  apikey: skey1
  secret: svalue1
  port: 7880
  internal_turn: true

whiteboard:
  optimized: true
  optimized_type: node
  optimized_url: http://localhost:8010/opt
  optimized_interval: 30 #second default 200
  snapshot: true
  save_in_db: true

 

upload_file:
  external_file_server: false
  external_office_file_server: false
  external_file_server_id: fs101
  external_file_server_url: http://localhost:3000
