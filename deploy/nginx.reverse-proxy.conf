# (اختیاری) Nginx جلوی PersianMeet — وقتی auto_ssl: false کرده‌اید و می‌خواهید TLS را خودتان مدیریت کنید.
# مسیر پیشنهادشده: /etc/nginx/sites-available/persianmeet.conf  →  ln -s ... sites-enabled/
# سپس: nginx -t && systemctl reload nginx

# --- مپ WebSocket برای /wsroom ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name class.example.com;

    # هدایت همه چیز به https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name class.example.com;

    ssl_certificate     /etc/letsencrypt/live/class.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/class.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 512m;   # آپلود فایل‌های درسی

    # ---------- (اختیاری) برندینگ بدون دست‌بردن در فایل‌های فروشنده ----------
    # لوگوی خودتان را در /opt/branding/ نگه دارید و با sub_filter جایگزین کنید:
    # location /branding/ { root /opt; }
    # location / {
    #     proxy_pass http://127.0.0.1:8003;
    #     proxy_set_header Accept-Encoding "";        # تا sub_filter روی متن کار کند
    #     sub_filter '</head>' '<link rel="stylesheet" href="/branding/brand.css"></head>';
    #     sub_filter_once on;
    #     include /etc/nginx/conf.d/pm-proxy-headers.inc;
    # }

    location /wsroom {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;      # نشست‌های طولانی
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
