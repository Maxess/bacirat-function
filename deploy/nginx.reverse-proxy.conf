# (اختیاری) Nginx جلوی PersianMeet — وقتی auto_ssl: false کرده‌اید و می‌خواهید TLS را خودتان مدیریت کنید.
# مسیر پیشنهادشده: /etc/nginx/sites-available/persianmeet.conf  →  ln -s ... sites-enabled/
# سپس: nginx -t && systemctl reload nginx

# --- مپ WebSocket برای /wsroom ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name class.example.com;

    # هدایت همه چیز به https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name class.example.com;

    ssl_certificate     /etc/letsencrypt/live/class.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/class.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 512m;   # آپلود فایل‌های درسی

    # ---------- برند پویا (نام/لوگو/آیکون از پنل ادمین محصول) ----------
    # فایل‌های برند از خودِ dist محصول سرو می‌شوند ولی هرگز نباید کش شوند
    location /brand/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # API برند — هم‌مبدأ، روی classroom-manager (پیش‌فرض 127.0.0.1:8090)
    # احراز هویت با GUID ادمین محصول انجام می‌شود (X-PM-GUID)؛ فایل آپلود لوگو/آیکون همین‌جا می‌رود
    location /brand-api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    location /wsroom {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;      # نشست‌های طولانی
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
