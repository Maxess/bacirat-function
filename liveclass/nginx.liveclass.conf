# نمونه‌ی nginx برای LiveClass — توپولوژی پیشنهادی: دو server-block
#   اپ و API:  https://class.example.com   → FastAPI (127.0.0.1:8200)
#   سیگنالینگ: wss://livekit.example.com   → LiveKit (127.0.0.1:7880)
# مدیا (UDP) از nginx رد نمی‌شود — پورت‌های UDP بازه‌ی rtc (پیش‌فرض 50000-60000) و TCP 7881 باید در فایروال باز باشند.

server {
    listen 443 ssl http2;
    server_name class.example.com;
    # ssl_certificate     /etc/letsencrypt/live/class.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/class.example.com/privkey.pem;

    client_max_body_size 30m;  # PDF تا ۲۵MB

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl http2;
    server_name livekit.example.com;
    # ssl_certificate     /etc/letsencrypt/live/livekit.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/livekit.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# سپس در /etc/liveclass/liveclass.env:
#   LIVECLASS_LIVEKIT_PUBLIC_URL=wss://livekit.example.com
